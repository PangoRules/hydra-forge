services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # ${POSTGRES_PORT:-5433} on host → 5432 in container. Avoids conflict with
      # local postgres or any other service using 5432 on the host.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Inside Docker, the server reaches Postgres by service name and container port.
      # .env keeps localhost:${POSTGRES_PORT:-5433} for host-side `dotnet run`.
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      # MinIO defaults for Docker — only active when FileStorage__Provider=S3.
      # Override via .env for local `dotnet run` (endpoint=http://localhost:9000).
      FileStorage__LocalPath: /data/hydraforge/attachments
      FileStorage__S3__Endpoint: http://minio:9000
      FileStorage__S3__AccessKey: ${MINIO_ROOT_USER:-minioadmin}
      FileStorage__S3__SecretKey: ${MINIO_ROOT_PASSWORD:-minioadmin}
      FileStorage__S3__BucketName: ${MINIO_BUCKET:-hydraforge-attachments}
      FileStorage__S3__Region: ${MINIO_REGION:-us-east-1}
      FileStorage__S3__ForcePathStyle: "true"
      # Allow both nginx (port 8080) and direct Nuxt access (port 3000) as origins.
      # Only matters for genuinely cross-origin browser calls — same-origin access
      # through nginx (including by IP, e.g. a Tailscale address) never needs this,
      # the browser doesn't enforce CORS on same-origin requests regardless of what
      # this list contains. Set CORS_ALLOWED_ORIGINS in .env to silence the harmless
      # "CORS policy execution failed" log noise for a specific non-default origin.
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:8080,http://localhost:3000}
    ports:
      # 5000 on host → 8080 in container. Host 8080 is taken by Odysseus SearXNG.
      - "5000:8080"
    volumes:
      - hydraforge-attachments:/data/hydraforge/attachments
    extra_hosts:
      # Allows the container to reach services on the Docker host, including
      # Odysseus's SearXNG at http://host.docker.internal:8080.
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: src/web-ui
      dockerfile: Dockerfile
    depends_on:
      server:
        condition: service_started
    environment:
      NUXT_API_BASE_URL: http://server:8080
      NUXT_PUBLIC_AUTH_COOKIE_SECURE: "false"
      # Leave NUXT_PUBLIC_SIGNALR_BASE_URL unset → empty string → relative
      # /hubs/... URLs, resolved by the browser against whatever origin it's
      # actually on (nginx proxies /hubs/ there for any host/IP). A fixed
      # absolute value here (e.g. http://localhost) gets baked into the page
      # for every client regardless of how they reached it — breaks any
      # client that isn't the Docker host itself (LAN IP, Tailscale, etc).
      # Only set this if you deliberately want clients to bypass nginx and
      # hit :3000 directly for everything except SignalR.
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    ports:
      # Off the default :80 on purpose — leaves the bare hostname/IP free for
      # anything else you want to run on this box later. Change the host-side
      # number here if you'd rather use a different port.
      - "8080:80"
    environment:
      # Full Docker stack defaults. For hybrid mode (API + UI running locally),
      # set in .env: BACKEND_HOST=host.docker.internal:5000  NUXT_HOST=host.docker.internal:3000
      BACKEND_HOST: ${BACKEND_HOST:-server:8080}
      NUXT_HOST: ${NUXT_HOST:-web:3000}
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  searxng:
    # Only needed if Odysseus (or another SearXNG instance) is NOT running.
    # Default: reuse Odysseus's SearXNG at http://host.docker.internal:8080.
    # To use this instead: docker compose --profile search up
    # and set SearXng__BaseUrl=http://searxng:8080 in .env
    image: searxng/searxng:latest
    profiles: ["search"]
    ports:
      - "8082:8080"

  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    profiles: ["notifications"]
    command: serve
    environment:
      TZ: UTC
      NTFY_BASE_URL: http://ntfy:80
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
    volumes:
      - ntfy-data:/var/lib/ntfy
    ports:
      - "8083:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "http://localhost:80/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres-data:
  minio-data:
  hydraforge-attachments:
  ntfy-data:
